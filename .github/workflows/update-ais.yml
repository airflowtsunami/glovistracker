name: Update GLOVIS CENTURY AIS

on:
  schedule:
    # Run at 7, 27, 47 and 57 minutes past every hour.
    - cron: "7,27,47,57 * * * *"

  # Allows you to press "Run workflow" manually.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ais:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Fetch latest GLOVIS CENTURY AIS
        run: |
          python update_ais.py

      - name: Show AIS result
        run: |
          if [ -f ais.json ]; then
            cat ais.json
          else
            echo "ais.json was not created"
            exit 1
          fi

      - name: Update route YAML from AIS
        run: |
          python update_route.py

      - name: Show updated route
        run: |
          if [ -f route.yml ]; then
            cat route.yml
          else
            echo "route.yml was not found"
            exit 1
          fi

      - name: Commit updated AIS and route
        run: |
          git config user.name "glovis-ais-bot"
          git config user.email "actions@users.noreply.github.com"

          git add ais.json route.yml

          if git diff --cached --quiet; then
            echo "No AIS or route changes to commit"
          else
            git commit -m "Update GLOVIS CENTURY AIS and route"
            git push
          fi
