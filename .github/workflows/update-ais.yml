name: Update GLOVIS CENTURY AIS

on:
  schedule:
    # Run at 17 minutes past every hour.
    - cron: "7,27,37,47 * * * *"

  # Allows you to press "Run workflow" manually.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ais:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch latest Voyage Radar AIS
        run: |
          python update_ais.py

      - name: Show AIS result
        run: |
          if [ -f ais.json ]; then
            cat ais.json
          else
            echo "ais.json was not created"
            exit 1
          fi

      - name: Commit updated AIS
        run: |
          git config user.name "glovis-ais-bot"
          git config user.email "actions@users.noreply.github.com"

          git add ais.json

          if git diff --cached --quiet; then
            echo "No AIS changes to commit"
          else
            git commit -m "Update GLOVIS CENTURY AIS"
            git push
          fi
