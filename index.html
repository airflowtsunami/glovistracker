<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>GLOVIS CENTURY – Tesla Voyage Tracker</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #08131f;
  color: white;
}

#map {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
}

.header {
  position: absolute;
  z-index: 1000;
  top: 8px;
  left: 8px;
  background: rgba(5,16,27,.94);
  padding: 9px 12px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,.35);
}

.header h2 {
  margin: 0 0 3px;
  font-size: 18px;
}

.header .sub {
  color: #9db0c3;
  font-size: 11px;
}

#aisHeadline {
  position: absolute;
  z-index: 1001;
  top: 70px;
  left: 8px;
  right: 8px;
  background: rgba(0,194,255,.94);
  color: #00121f;
  padding: 8px 11px;
  border-radius: 9px;
  font-size: 12px;
  line-height: 1.35;
  box-shadow: 0 4px 15px rgba(0,0,0,.3);
}

#aisHeadline a {
  color: inherit;
  font-weight: bold;
}

#controls {
  flex: 0 0 auto;
  width: 100%;
  background: #0c1d2d;
  border-top: 1px solid #21384b;

  padding:
    10px
    max(14px, env(safe-area-inset-right))
    max(10px, env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
}

#dateDisplay {
  font-size: 16px;
  font-weight: 650;
}

#status {
  margin-top: 3px;
  font-size: 11px;
  color: #8fa8bd;
  line-height: 1.35;
}

#slider {
  display: block;
  width: 100%;
  margin: 11px 0 5px;
  accent-color: #2e9fff;
}

.sliderLabels {
  display: flex;
  justify-content: space-between;
  gap: 5px;
  font-size: 9px;
  color: #8299ad;
}

.buttonRow {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 7px 10px;
  cursor: pointer;
  background: #1d75b9;
  color: white;
  font-weight: 600;
  font-size: 12px;
}

button:hover {
  background: #2e95dd;
}

.ship-icon {
  font-size: 36px;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.75));
}

.port-label {
  background: #10283b;
  color: white;
  border: 1px solid #4f7188;
  border-radius: 5px;
  padding: 2px 6px;
}

.ais-label {
  background: #ffd54a;
  color: #111;
  border: 1px solid #8d7415;
  border-radius: 5px;
  padding: 3px 7px;
  font-weight: 800;
  white-space: nowrap;
}

.current-label {
  background: #ff6b35;
  color: white;
  border: 1px solid #8c2d0d;
  border-radius: 5px;
  padding: 3px 7px;
  font-weight: 800;
  white-space: nowrap;
}

.ais-pulse {
  width: 20px;
  height: 20px;
  background: #ffd400;
  border: 3px solid white;
  border-radius: 50%;
  box-shadow:
    0 0 0 0 rgba(255,212,0,.75),
    0 2px 8px rgba(0,0,0,.65);
  animation: pulseAIS 1.8s infinite;
}

@keyframes pulseAIS {
  0% {
    box-shadow:
      0 0 0 0 rgba(255,212,0,.75),
      0 2px 8px rgba(0,0,0,.65);
  }

  70% {
    box-shadow:
      0 0 0 16px rgba(255,212,0,0),
      0 2px 8px rgba(0,0,0,.65);
  }

  100% {
    box-shadow:
      0 0 0 0 rgba(255,212,0,0),
      0 2px 8px rgba(0,0,0,.65);
  }
}

@media (max-width: 600px) {
  .header {
    top: 5px;
    left: 5px;
    right: 5px;
    padding: 7px 9px;
  }

  .header h2 {
    font-size: 14px;
  }

  .header .sub {
    font-size: 9px;
  }

  #aisHeadline {
    top: 50px;
    left: 5px;
    right: 5px;
    padding: 6px 8px;
    font-size: 9.5px;
  }

  #dateDisplay {
    font-size: 14px;
  }

  #status {
    font-size: 9.5px;
  }

  .sliderLabels {
    font-size: 8px;
  }

  button {
    flex: 1 1 auto;
    font-size: 10px;
    padding: 6px 7px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h2>🚢 GLOVIS CENTURY</h2>
  <div class="sub">
    IMO 9590589 · Tesla voyage tracker
  </div>
</div>

<div id="aisHeadline">
  🟡 <strong>Loading latest AIS…</strong>
</div>

<div id="map"></div>

<div id="controls">

  <div id="dateDisplay"></div>
  <div id="status"></div>

  <input
    id="slider"
    type="range"
    min="0"
    value="0"
    step="1"
  >

  <div class="sliderLabels">
    <span>Last AIS</span>
    <span>Suva</span>
    <span>28 Aug · Auckland</span>
  </div>

  <div class="buttonRow">
    <button id="todayButton">Today</button>
    <button id="plus7Button">+7 days</button>
    <button id="refreshButton">↻ Refresh</button>
    <button id="playButton">▶ Play</button>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =================================================
   SOURCE
   ================================================= */

const SOURCE_URL =
  "https://www.vesselfinder.com/vessels/details/9590589";


/* =================================================
   PORTS
   ================================================= */

const SUVA = {
  name: "Suva",
  lat: -18.1416,
  lng: 178.4419,

  // Actual arrival:
  // 22 Aug 2026 19:55 UTC
  time: new Date("2026-08-22T19:55:00Z")
};


/*
   Monday 24 Aug 2026
   12:00 pm NZST
   =
   00:00 UTC
*/

const SUVA_DEPARTURE = {
  name: "Suva departure",
  lat: -18.1416,
  lng: 178.4419,
  time: new Date("2026-08-24T00:00:00Z")
};


const LAUTOKA = {
  name: "Lautoka",
  lat: -17.6169,
  lng: 177.4505
};


const AUCKLAND = {
  name: "Auckland",
  lat: -36.8406,
  lng: 174.7850,

  // 28 Aug 2026 00:01 NZST
  time: new Date("2026-08-28T00:01:00+12:00")
};


const KOBE = {
  name: "Kobe",
  lat: 34.6901,
  lng: 135.1955
};


/* =================================================
   ICONS
   ================================================= */

const shipIcon =
  L.divIcon({
    html: '<div class="ship-icon">🚢</div>',
    className: "",
    iconSize: [44,44],
    iconAnchor: [22,22]
  });


const aisIcon =
  L.divIcon({
    html: '<div class="ais-pulse"></div>',
    className: "",
    iconSize: [26,26],
    iconAnchor: [13,13]
  });


/* =================================================
   FALLBACK AIS
   ================================================= */

let latestAIS = {
  lat: -18.1416,
  lng: 178.4419,
  time: new Date("2026-08-22T19:55:00Z"),
  reported: "22 Aug 2026, 19:55 UTC",
  speed: 0,
  course: null,
  heading: null,
  waterBody: "Suva",
  source: "AIS",
  checkedAt: ""
};


/* =================================================
   MAP
   ================================================= */

const map =
  L.map("map", {
    zoomControl: true
  });


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 15,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =================================================
   PORT MARKERS
   ================================================= */

function addPortMarker(point) {

  L.circleMarker(
    [point.lat, point.lng],
    {
      radius: 6,
      color: "#ffffff",
      weight: 2,
      fillColor: "#1a89d9",
      fillOpacity: 1
    }
  )
  .addTo(map)
  .bindTooltip(
    point.name,
    {
      permanent: true,
      direction: "top",
      className: "port-label"
    }
  );
}


addPortMarker(SUVA);
addPortMarker(LAUTOKA);
addPortMarker(AUCKLAND);
addPortMarker(KOBE);


/* =================================================
   AIS RANGE RINGS
   ================================================= */

const NM_TO_METERS = 1852;


function addAisRing(point, nm, color, dash, label) {

  L.circle(
    [point.lat, point.lng],
    {
      radius: nm * NM_TO_METERS,
      color: color,
      weight: 5,
      opacity: 0.95,
      fillColor: color,
      fillOpacity: 0.03,
      dashArray: dash
    }
  )
  .addTo(map)
  .bindTooltip(
    label,
    {
      permanent: false,
      direction: "center",
      className: "port-label"
    }
  );
}


addAisRing(
  SUVA,
  40,
  "#0f7a3d",
  "",
  "Suva · likely terrestrial AIS range ~40 nm"
);

addAisRing(
  LAUTOKA,
  40,
  "#0f7a3d",
  "",
  "Lautoka · likely terrestrial AIS range ~40 nm"
);

addAisRing(
  AUCKLAND,
  40,
  "#0f7a3d",
  "",
  "Auckland · likely terrestrial AIS range ~40 nm"
);

addAisRing(
  KOBE,
  40,
  "#0f7a3d",
  "",
  "Kobe · likely terrestrial AIS range ~40 nm"
);


/* =================================================
   REAL AIS MARKER

   IMPORTANT:
   Higher zIndex than estimated ship.
   Label goes LEFT.
   ================================================= */

const aisMarker =
  L.marker(
    [latestAIS.lat, latestAIS.lng],
    {
      icon: aisIcon,
      zIndexOffset: 5000
    }
  )
  .addTo(map)
  .bindTooltip(
    "Last real AIS",
    {
      permanent: true,
      direction: "left",
      offset: [-12,0],
      className: "ais-label"
    }
  );


/* =================================================
   ESTIMATED BOAT

   Lower zIndex than real AIS.
   Label goes RIGHT.
   ================================================= */

const ship =
  L.marker(
    [latestAIS.lat, latestAIS.lng],
    {
      icon: shipIcon,
      zIndexOffset: 3000
    }
  )
  .addTo(map)
  .bindTooltip(
    "Estimated position",
    {
      permanent: true,
      direction: "right",
      offset: [18,0],
      className: "current-label"
    }
  );


/* =================================================
   ROUTE LINES
   ================================================= */

const travelledLine =
  L.polyline(
    [],
    {
      color: "#00c2ff",
      weight: 5,
      opacity: .95
    }
  )
  .addTo(map);


const futureRoute =
  L.polyline(
    [],
    {
      color: "#469fe1",
      weight: 3,
      opacity: .55,
      dashArray: "8 8"
    }
  )
  .addTo(map);


/* =================================================
   HELPERS
   ================================================= */

function interpolate(a, b, fraction) {

  const f =
    Math.max(
      0,
      Math.min(
        1,
        fraction
      )
    );


  return {
    lat:
      a.lat +
      (b.lat - a.lat) * f,

    lng:
      a.lng +
      (b.lng - a.lng) * f
  };
}


function distanceNm(lat1, lng1, lat2, lng2) {

  const meters =
    map.distance(
      [lat1, lng1],
      [lat2, lng2]
    );

  return meters / 1852;
}


/* =================================================
   ESTIMATED POSITION
   ================================================= */

function getEstimatedPosition(selectedTime) {

  const aisTime =
    latestAIS.time;


  /*
     AIS already at/after Auckland.
  */

  if (
    aisTime >= AUCKLAND.time
  ) {

    return {
      lat: latestAIS.lat,
      lng: latestAIS.lng,
      leg: "LATEST_AIS"
    };
  }


  /*
     -----------------------------------------------
     NEW AIS FIX AFTER SUVA DEPARTURE

     Re-anchor projection automatically from the
     latest REAL AIS position.
     -----------------------------------------------
  */

  if (
    aisTime > SUVA_DEPARTURE.time
  ) {

    if (
      selectedTime <= aisTime
    ) {

      return {
        lat: latestAIS.lat,
        lng: latestAIS.lng,
        leg: "AIS"
      };
    }


    if (
      selectedTime <= AUCKLAND.time
    ) {

      const fraction =
        (
          selectedTime -
          aisTime
        )
        /
        (
          AUCKLAND.time -
          aisTime
        );


      return {
        ...interpolate(
          latestAIS,
          AUCKLAND,
          fraction
        ),
        leg: "AIS_TO_AUCKLAND"
      };
    }


    return {
      lat: AUCKLAND.lat,
      lng: AUCKLAND.lng,
      leg: "AUCKLAND"
    };
  }


  /*
     Vessel has arrived at Suva.
  */

  if (
    aisTime >= SUVA.time
  ) {

    if (
      selectedTime <= aisTime
    ) {

      return {
        lat: latestAIS.lat,
        lng: latestAIS.lng,
        leg: "AIS"
      };
    }


    /*
       Hold at Suva until estimated departure.
    */

    if (
      selectedTime <= SUVA_DEPARTURE.time
    ) {

      return {
        lat: latestAIS.lat,
        lng: latestAIS.lng,
        leg: "AT_SUVA"
      };
    }


    /*
       Departure has passed, but no newer AIS yet.
       Estimate from Suva toward Auckland.
    */

    if (
      selectedTime <= AUCKLAND.time
    ) {

      const fraction =
        (
          selectedTime -
          SUVA_DEPARTURE.time
        )
        /
        (
          AUCKLAND.time -
          SUVA_DEPARTURE.time
        );


      return {
        ...interpolate(
          SUVA,
          AUCKLAND,
          fraction
        ),
        leg: "SUVA_TO_AUCKLAND"
      };
    }


    return {
      lat: AUCKLAND.lat,
      lng: AUCKLAND.lng,
      leg: "AUCKLAND"
    };
  }


  /*
     Before Suva.
  */

  if (
    selectedTime <= aisTime
  ) {

    return {
      lat: latestAIS.lat,
      lng: latestAIS.lng,
      leg: "AIS"
    };
  }


  if (
    selectedTime <= SUVA.time
  ) {

    const fraction =
      (
        selectedTime -
        aisTime
      )
      /
      (
        SUVA.time -
        aisTime
      );


    return {
      ...interpolate(
        latestAIS,
        SUVA,
        fraction
      ),
      leg: "AIS_TO_SUVA"
    };
  }


  /*
     At Suva before departure.
  */

  if (
    selectedTime <= SUVA_DEPARTURE.time
  ) {

    return {
      lat: SUVA.lat,
      lng: SUVA.lng,
      leg: "AT_SUVA"
    };
  }


  /*
     Suva -> Auckland.
  */

  if (
    selectedTime <= AUCKLAND.time
  ) {

    const fraction =
      (
        selectedTime -
        SUVA_DEPARTURE.time
      )
      /
      (
        AUCKLAND.time -
        SUVA_DEPARTURE.time
      );


    return {
      ...interpolate(
        SUVA,
        AUCKLAND,
        fraction
      ),
      leg: "SUVA_TO_AUCKLAND"
    };
  }


  return {
    lat: AUCKLAND.lat,
    lng: AUCKLAND.lng,
    leg: "AUCKLAND"
  };
}


/* =================================================
   SLIDER
   ================================================= */

const slider =
  document.getElementById("slider");


function updateSliderRange() {

  const totalHours =
    Math.max(
      1,
      Math.round(
        (
          AUCKLAND.time -
          latestAIS.time
        )
        /
        3600000
      )
    );


  slider.min = 0;
  slider.max = totalHours;
}


/* =================================================
   FORMATTERS

   All times displayed in NZ time.
   ================================================= */

const dateFormat =
  new Intl.DateTimeFormat(
    "en-NZ",
    {
      timeZone: "Pacific/Auckland",
      weekday: "short",
      day: "numeric",
      month: "short",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );


const checkedFormat =
  new Intl.DateTimeFormat(
    "en-NZ",
    {
      timeZone: "Pacific/Auckland",
      day: "numeric",
      month: "short",
      hour: "numeric",
      minute: "2-digit"
    }
  );


/* =================================================
   AIS RANGE MESSAGE
   ================================================= */

function getAisRangeHint(p) {

  const locations = [
    {
      point: SUVA,
      name: "Suva"
    },
    {
      point: LAUTOKA,
      name: "Lautoka"
    },
    {
      point: AUCKLAND,
      name: "Auckland"
    }
  ];


  let nearest = null;


  locations.forEach(item => {

    const distance =
      distanceNm(
        p.lat,
        p.lng,
        item.point.lat,
        item.point.lng
      );


    if (
      !nearest ||
      distance < nearest.distance
    ) {

      nearest = {
        name: item.name,
        distance: distance
      };
    }

  });


  if (!nearest) {
    return "";
  }


  if (
    nearest.distance <= 40
  ) {

    return (
      ` · 📡 likely within ${nearest.name} terrestrial AIS range ` +
      `(${nearest.distance.toFixed(0)} nm)`
    );
  }


  if (
    nearest.distance <= 80
  ) {

    return (
      ` · 📡 approaching possible ${nearest.name} AIS range ` +
      `(${nearest.distance.toFixed(0)} nm)`
    );
  }


  return (
    ` · nearest AIS area: ${nearest.name} ` +
    `${nearest.distance.toFixed(0)} nm`
  );
}


/* =================================================
   UPDATE DISPLAY
   ================================================= */

function updateVoyage(hours) {

  const selected =
    new Date(
      latestAIS.time.getTime() +
      hours * 3600000
    );


  const p =
    getEstimatedPosition(
      selected
    );


  ship.setLatLng(
    [p.lat, p.lng]
  );


  document
    .getElementById("dateDisplay")
    .textContent =
      dateFormat.format(
        selected
      );


  let status;


  switch (p.leg) {

    case "AIS":
      status =
        "Last real AIS position";
      break;

    case "AIS_TO_SUVA":
      status =
        "Estimated · latest AIS → Suva";
      break;

    case "AT_SUVA":
      status =
        "⚓ Moored at Suva";
      break;

    case "SUVA_TO_AUCKLAND":
      status =
        "Estimated · Suva → Auckland";
      break;

    case "AIS_TO_AUCKLAND":
      status =
        "Estimated · latest AIS → Auckland";
      break;

    case "LATEST_AIS":
      status =
        "Latest real AIS position";
      break;

    default:
      status =
        "📍 Auckland";
  }


  const latitude =
    Math.abs(
      p.lat
    ).toFixed(2) +
    "°" +
    (
      p.lat < 0
        ? "S"
        : "N"
    );


  const longitude =
    Math.abs(
      p.lng
    ).toFixed(2) +
    "°" +
    (
      p.lng < 0
        ? "W"
        : "E"
    );


  const aisHint =
    getAisRangeHint(
      p
    );


  document
    .getElementById("status")
    .textContent =
      status +
      " · " +
      latitude +
      ", " +
      longitude +
      aisHint;


  updateRouteLines(
    p
  );
}


/* =================================================
   ROUTE DISPLAY
   ================================================= */

function updateRouteLines(p) {


  if (
    p.leg === "AT_SUVA"
  ) {

    travelledLine.setLatLngs([
      [latestAIS.lat, latestAIS.lng]
    ]);


    futureRoute.setLatLngs([
      // [SUVA.lat, SUVA.lng],
      [latestAIS.lat, latestAIS.lng],
      [AUCKLAND.lat, AUCKLAND.lng]
    ]);


    return;
  }


  if (
    p.leg === "AIS_TO_AUCKLAND"
  ) {

    travelledLine.setLatLngs([
      [latestAIS.lat, latestAIS.lng],
      [p.lat, p.lng]
    ]);


    futureRoute.setLatLngs([
      [p.lat, p.lng],
      [AUCKLAND.lat, AUCKLAND.lng]
    ]);


    return;
  }


  if (
    p.leg === "SUVA_TO_AUCKLAND"
  ) {

    travelledLine.setLatLngs([
      [SUVA.lat, SUVA.lng],
      [p.lat, p.lng]
    ]);


    futureRoute.setLatLngs([
      [p.lat, p.lng],
      [AUCKLAND.lat, AUCKLAND.lng]
    ]);


    return;
  }


  if (
    p.leg === "AIS_TO_SUVA"
  ) {

    travelledLine.setLatLngs([
      [latestAIS.lat, latestAIS.lng],
      [p.lat, p.lng]
    ]);


    futureRoute.setLatLngs([
      [p.lat, p.lng],
      [SUVA.lat, SUVA.lng],
      [AUCKLAND.lat, AUCKLAND.lng]
    ]);


    return;
  }


  if (
    p.leg === "AUCKLAND"
  ) {

    travelledLine.setLatLngs([
      [latestAIS.lat, latestAIS.lng],
      [AUCKLAND.lat, AUCKLAND.lng]
    ]);


    futureRoute.setLatLngs([]);

    return;
  }


  travelledLine.setLatLngs([
    [latestAIS.lat, latestAIS.lng]
  ]);


  futureRoute.setLatLngs([
    [latestAIS.lat, latestAIS.lng],
    [SUVA.lat, SUVA.lng],
    [AUCKLAND.lat, AUCKLAND.lng]
  ]);
}


/* =================================================
   TODAY
   ================================================= */

function goToday() {

  let hours =
    Math.round(
      (
        Date.now() -
        latestAIS.time.getTime()
      )
      /
      3600000
    );


  hours =
    Math.max(
      0,
      Math.min(
        Number(slider.max),
        hours
      )
    );


  slider.value =
    hours;


  updateVoyage(
    hours
  );
}


/* =================================================
   +7 DAYS
   ================================================= */

function goPlus7() {

  const target =
    Date.now() +
    7 * 24 * 3600000;


  let hours =
    Math.round(
      (
        target -
        latestAIS.time.getTime()
      )
      /
      3600000
    );


  hours =
    Math.max(
      0,
      Math.min(
        Number(slider.max),
        hours
      )
    );


  slider.value =
    hours;


  updateVoyage(
    hours
  );
}


/* =================================================
   LOAD ais.json
   ================================================= */

async function refreshAIS() {

  const headline =
    document.getElementById(
      "aisHeadline"
    );


  headline.innerHTML =
    "🟡 <strong>Checking latest saved AIS…</strong>";


  try {

    const response =
      await fetch(
        "ais.json?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "ais.json HTTP " +
        response.status
      );
    }


    const ais =
      await response.json();


    if (
      !Number.isFinite(
        Number(ais.lat)
      ) ||
      !Number.isFinite(
        Number(ais.lng)
      ) ||
      !ais.time
    ) {

      throw new Error(
        "Invalid ais.json"
      );
    }


    latestAIS = {

      lat:
        Number(ais.lat),

      lng:
        Number(ais.lng),

      time:
        new Date(
          ais.time
        ),

      reported:
        ais.reported ||
        ais.time,

      speed:
        ais.speed === null ||
        ais.speed === undefined
          ? null
          : Number(
              ais.speed
            ),

      course:
        ais.course === null ||
        ais.course === undefined
          ? null
          : Number(
              ais.course
            ),

      heading:
        ais.heading === null ||
        ais.heading === undefined
          ? null
          : Number(
              ais.heading
            ),

      waterBody:
        ais.waterBody ||
        ais.port ||
        "",

      source:
        ais.source ||
        "AIS",

      checkedAt:
        ais.checked_at ||
        ""
    };


    /*
       Move real AIS marker.
    */

    aisMarker.setLatLng([
      latestAIS.lat,
      latestAIS.lng
    ]);


    /*
       Convert raw UTC timestamp to NZ time.
    */

    const aisNZTime =
      dateFormat.format(
        latestAIS.time
      );


    /*
       REAL AIS label always includes time.
    */

    aisMarker.setTooltipContent(
      "Last real AIS · " +
      aisNZTime
    );


    /*
       Blue headline.
    */

    let text =
      `🟡 <strong>Latest real AIS:</strong>
       ${aisNZTime}
       · ${latestAIS.lat.toFixed(5)}°,
       ${latestAIS.lng.toFixed(5)}°`;


    if (
      Number.isFinite(
        latestAIS.speed
      )
    ) {

      text +=
        ` · ${latestAIS.speed} kn`;
    }


    if (
      Number.isFinite(
        latestAIS.course
      )
    ) {

      text +=
        ` · COG ${latestAIS.course}°`;
    }


    if (
      latestAIS.waterBody
    ) {

      text +=
        ` · ${latestAIS.waterBody}`;
    }


    if (
      latestAIS.checkedAt
    ) {

      const checkedDate =
        new Date(
          latestAIS.checkedAt
        );


      if (
        !isNaN(
          checkedDate.getTime()
        )
      ) {

        text +=
          ` · checked ${checkedFormat.format(checkedDate)}`;
      }
    }


    text +=
      ` · <a
       href="${SOURCE_URL}"
       target="_blank"
       rel="noopener">
       source
       </a>`;


    headline.innerHTML =
      text;


    updateSliderRange();

    goToday();

    fitMap();

  }

  catch (error) {

    console.warn(
      "Could not load ais.json:",
      error
    );


    const fallbackNZTime =
      dateFormat.format(
        latestAIS.time
      );


    aisMarker.setTooltipContent(
      "Last real AIS · " +
      fallbackNZTime
    );


    let fallbackText =
      `🟡 <strong>Using built-in last AIS:</strong>
       ${fallbackNZTime}
       · ${latestAIS.lat.toFixed(5)}°,
       ${latestAIS.lng.toFixed(5)}°`;


    fallbackText +=
      ` · run the GitHub Action to create/update ais.json`;


    headline.innerHTML =
      fallbackText;


    updateSliderRange();

    goToday();

    fitMap();
  }
}


/* =================================================
   FIT MAP
   ================================================= */

function fitMap() {

  const points = [
    [latestAIS.lat, latestAIS.lng],
    [SUVA.lat, SUVA.lng],
    [LAUTOKA.lat, LAUTOKA.lng],
    [AUCKLAND.lat, AUCKLAND.lng]
  ];


  map.fitBounds(
    L.latLngBounds(
      points
    ),
    {
      padding: [45,45]
    }
  );
}


/* =================================================
   PLAY
   ================================================= */

let timer =
  null;


function playVoyage() {

  const button =
    document.getElementById(
      "playButton"
    );


  if (timer) {

    clearInterval(
      timer
    );


    timer =
      null;


    button.textContent =
      "▶ Play";


    return;
  }


  slider.value =
    0;


  updateVoyage(
    0
  );


  button.textContent =
    "⏸ Pause";


  timer =
    setInterval(
      () => {

        let hours =
          Number(
            slider.value
          )
          +
          3;


        if (
          hours >
          Number(
            slider.max
          )
        ) {

          clearInterval(
            timer
          );


          timer =
            null;


          button.textContent =
            "▶ Play";


          return;
        }


        slider.value =
          hours;


        updateVoyage(
          hours
        );

      },
      40
    );
}


/* =================================================
   EVENTS
   ================================================= */

document
  .getElementById(
    "todayButton"
  )
  .addEventListener(
    "click",
    goToday
  );


document
  .getElementById(
    "plus7Button"
  )
  .addEventListener(
    "click",
    goPlus7
  );


document
  .getElementById(
    "refreshButton"
  )
  .addEventListener(
    "click",
    refreshAIS
  );


document
  .getElementById(
    "playButton"
  )
  .addEventListener(
    "click",
    playVoyage
  );


slider.addEventListener(
  "input",
  () => {

    updateVoyage(
      Number(
        slider.value
      )
    );

  }
);


/* =================================================
   MOBILE RESIZE
   ================================================= */

function resizeMap() {

  setTimeout(
    () => {
      map.invalidateSize();
    },
    100
  );
}


window.addEventListener(
  "resize",
  resizeMap
);


window.addEventListener(
  "orientationchange",
  resizeMap
);


/* =================================================
   START
   ================================================= */

updateSliderRange();

goToday();

fitMap();

refreshAIS();


/*
   Reload ais.json every five minutes.
*/

setInterval(
  refreshAIS,
  5 * 60 * 1000
);

</script>
