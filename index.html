<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOVIS CENTURY – Tesla Voyage Tracker</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #08131f;
    color: white;
  }

  #map {
    height: calc(100vh - 155px);
    width: 100%;
  }

  .header {
    position: absolute;
    z-index: 1000;
    top: 18px;
    left: 18px;
    background: rgba(5,16,27,.91);
    padding: 14px 18px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.3);
  }

  .header h2 {
    margin: 0 0 5px 0;
    font-size: 20px;
  }

  .header .sub {
    color: #9db0c3;
    font-size: 13px;
  }

  #controls {
    height: 155px;
    background: #0c1d2d;
    border-top: 1px solid #21384b;
    padding: 15px 24px;
  }

  #dateDisplay {
    font-size: 18px;
    font-weight: 650;
    color: #fff;
  }

  #status {
    margin-top: 3px;
    font-size: 13px;
    color: #8fa8bd;
  }

  #slider {
    width: 100%;
    margin: 18px 0 8px;
    accent-color: #2e9fff;
  }

  .sliderLabels {
    display: flex;
    justify-content: space-between;
    color: #8299ad;
    font-size: 11px;
  }

  button {
    margin-top: 10px;
    margin-right: 8px;
    border: 0;
    border-radius: 7px;
    padding: 8px 13px;
    cursor: pointer;
    background: #1d75b9;
    color: white;
    font-weight: 600;
  }

  button:hover {
    background: #2e95dd;
  }

  .ship-icon {
    font-size: 33px;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.6));
  }

  .port-label {
    background: #10283b;
    color: white;
    border: 1px solid #4f7188;
    border-radius: 5px;
    padding: 2px 6px;
  }

  .leaflet-tooltip {
    box-shadow: none;
  }
</style>
</head>

<body>

<div class="header">
  <h2>🚢 GLOVIS CENTURY</h2>
  <div class="sub">IMO 9590589 · Estimated Tesla voyage tracker</div>
</div>

<div id="map"></div>

<div id="controls">
  <div id="dateDisplay"></div>
  <div id="status"></div>

  <input
    id="slider"
    type="range"
    min="0"
    max="672"
    value="0"
    step="1">

  <div class="sliderLabels">
    <span>3 Aug · Kobe</span>
    <span>22 Aug · Suva</span>
    <span>31 Aug · Auckland</span>
  </div>

  <button onclick="goToday()">Today</button>
  <button onclick="goPlus7()">+ 7 days</button>
  <button onclick="playVoyage()">▶ Play voyage</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ---------------------------------------------------
// MAP
// ---------------------------------------------------

const map = L.map('map', {
  zoomControl: true
}).setView([-11, 158], 4);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 10,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);


// ---------------------------------------------------
// VOYAGE WAYPOINTS
//
// These are schedule/route anchors.
// Travel between them is interpolated.
// ---------------------------------------------------

const route = [

  {
    name: "Kobe",
    lat: 34.69,
    lng: 135.19,
    time: new Date("2026-08-03T12:00:00+09:00")
  },

  {
    name: "Suva",
    lat: -18.1416,
    lng: 178.4419,
    time: new Date("2026-08-22T17:30:00+12:00")
  },

  {
    name: "Auckland",
    lat: -36.8406,
    lng: 174.7850,
    time: new Date("2026-08-31T00:00:00+12:00")
  }

];


// ---------------------------------------------------
// PORT MARKERS
// ---------------------------------------------------

route.forEach(p => {

  L.circleMarker([p.lat, p.lng], {
    radius: 6,
    color: "#ffffff",
    weight: 2,
    fillColor: "#1a89d9",
    fillOpacity: 1
  })
  .addTo(map)
  .bindTooltip(
    p.name,
    {
      permanent: true,
      direction: "top",
      className: "port-label"
    }
  );

});


// ---------------------------------------------------
// FULL ROUTE
// ---------------------------------------------------

const fullRoute = route.map(p => [p.lat, p.lng]);

L.polyline(fullRoute, {
  color: "#469fe1",
  weight: 3,
  opacity: 0.48,
  dashArray: "8 8"
}).addTo(map);


// ---------------------------------------------------
// SHIP
// ---------------------------------------------------

const shipIcon = L.divIcon({
  html: '<div class="ship-icon">🚢</div>',
  className: "",
  iconSize: [40,40],
  iconAnchor: [20,20]
});

const ship = L.marker(
  [route[0].lat, route[0].lng],
  { icon: shipIcon }
).addTo(map);


// completed route

const travelledLine = L.polyline([], {
  color: "#00c2ff",
  weight: 5,
  opacity: 0.95
}).addTo(map);


// ---------------------------------------------------
// DATE RANGE
// ---------------------------------------------------

const startTime = route[0].time.getTime();
const endTime   = route[route.length-1].time.getTime();

const HOURS =
  Math.round(
    (endTime - startTime) /
    (1000 * 60 * 60)
  );

const slider = document.getElementById("slider");

slider.max = HOURS;


// ---------------------------------------------------
// INTERPOLATION
// ---------------------------------------------------

function interpolate(a, b, fraction) {

  return {
    lat:
      a.lat +
      (b.lat - a.lat) * fraction,

    lng:
      a.lng +
      (b.lng - a.lng) * fraction
  };

}


function getPosition(time) {

  if (time <= route[0].time)
    return {
      ...route[0],
      leg: 0,
      fraction: 0
    };

  if (time >= route[route.length-1].time)
    return {
      ...route[route.length-1],
      leg: route.length-2,
      fraction: 1
    };


  for (let i=0; i<route.length-1; i++) {

    const a = route[i];
    const b = route[i+1];

    if (time >= a.time && time <= b.time) {

      const fraction =
        (time - a.time) /
        (b.time - a.time);

      const pos =
        interpolate(a,b,fraction);

      return {
        ...pos,
        leg: i,
        fraction
      };
    }
  }
}


// ---------------------------------------------------
// UPDATE DISPLAY
// ---------------------------------------------------

function updateVoyage(hours) {

  const selected =
    new Date(
      startTime +
      hours * 3600000
    );

  const p =
    getPosition(selected);

  ship.setLatLng(
    [p.lat,p.lng]
  );


  // Build completed route

  const travelled = [];

  for (let i=0; i<=p.leg; i++) {
    travelled.push(
      [route[i].lat,route[i].lng]
    );
  }

  travelled.push(
    [p.lat,p.lng]
  );

  travelledLine.setLatLngs(
    travelled
  );


  // Date display

  const format =
    new Intl.DateTimeFormat(
      'en-NZ',
      {
        timeZone: 'Pacific/Auckland',
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        hour: 'numeric',
        minute: '2-digit'
      }
    );

  document.getElementById(
    "dateDisplay"
  ).textContent =
    format.format(selected);


  // Leg status

  let status;

  if (selected >= route[2].time) {

    status =
      "📍 Auckland — scheduled arrival";

  } else {

    const from =
      route[p.leg].name;

    const to =
      route[p.leg+1].name;

    status =
      "Estimated position · " +
      from +
      " → " +
      to;

  }

  document.getElementById(
    "status"
  ).textContent =
    status +
    " · " +
    Math.abs(p.lat).toFixed(2) +
    "°" +
    (p.lat < 0 ? "S" : "N") +
    ", " +
    Math.abs(p.lng).toFixed(2) +
    "°" +
    (p.lng < 0 ? "W" : "E");

}


// ---------------------------------------------------
// SLIDER
// ---------------------------------------------------

slider.addEventListener(
  "input",
  () => {
    updateVoyage(
      Number(slider.value)
    );
  }
);


// ---------------------------------------------------
// TODAY
// ---------------------------------------------------

function goToday() {

  const now =
    new Date();

  let h =
    Math.round(
      (now.getTime() - startTime) /
      3600000
    );

  h =
    Math.max(
      0,
      Math.min(HOURS,h)
    );

  slider.value = h;

  updateVoyage(h);
}


// ---------------------------------------------------
// PLUS SEVEN DAYS
// ---------------------------------------------------

function goPlus7() {

  const now =
    new Date();

  const target =
    new Date(
      now.getTime() +
      7 * 24 * 3600000
    );

  let h =
    Math.round(
      (target.getTime() - startTime) /
      3600000
    );

  h =
    Math.max(
      0,
      Math.min(HOURS,h)
    );

  slider.value = h;

  updateVoyage(h);
}


// ---------------------------------------------------
// PLAY ANIMATION
// ---------------------------------------------------

let timer = null;

function playVoyage() {

  if (timer) {
    clearInterval(timer);
    timer = null;
    return;
  }

  slider.value = 0;

  timer =
    setInterval(() => {

      let h =
        Number(slider.value) + 3;

      if (h > HOURS) {
        clearInterval(timer);
        timer = null;
        return;
      }

      slider.value = h;
      updateVoyage(h);

    },35);
}


// start at today

goToday();


// fit whole journey

map.fitBounds(
  L.latLngBounds(fullRoute),
  {
    padding:[50,50]
  }
);

</script>

</body>
</html>
