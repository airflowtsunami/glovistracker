<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>MORNING CARA – Tesla Voyage Tracker</title>

<link
  rel="icon"
  href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🚢</text></svg>'
>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #08131f;
  color: white;
}

#map {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
}

.header {
  position: absolute;
  z-index: 1000;
  top: 8px;
  left: 8px;
  background: rgba(5,16,27,.94);
  padding: 7px 10px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,.35);
}

.vesselHeader {
  display: flex;
  align-items: center;
  gap: 10px;
}

.headerBoatImage {
  display: block;
  width: 84px;
  height: 56px;
  object-fit: cover;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,.65);
  box-shadow: 0 2px 7px rgba(0,0,0,.45);
}

.headerBoatText {
  min-width: 0;
}

.header h2 {
  margin: 0 0 3px;
  font-size: 18px;
}

.header .sub {
  color: #9db0c3;
  font-size: 11px;
}

#aisHeadline {
  position: absolute;
  z-index: 1001;
  top: 82px;
  left: 8px;
  right: 8px;
  background: rgba(0,194,255,.94);
  color: #00121f;
  padding: 8px 11px;
  border-radius: 9px;
  font-size: 12px;
  line-height: 1.4;
  box-shadow: 0 4px 15px rgba(0,0,0,.3);
}

#aisHeadline a {
  color: inherit;
  font-weight: bold;
}

#controls {
  flex: 0 0 auto;
  width: 100%;
  background: #0c1d2d;
  border-top: 1px solid #21384b;

  padding:
    10px
    max(14px, env(safe-area-inset-right))
    max(10px, env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
}

#dateDisplay {
  font-size: 16px;
  font-weight: 650;
}

#status {
  margin-top: 3px;
  font-size: 11px;
  color: #8fa8bd;
  line-height: 1.35;
}

#slider {
  display: block;
  width: 100%;
  margin: 11px 0 5px;
  accent-color: #2e9fff;
}

.sliderLabels {
  display: flex;
  justify-content: space-between;
  gap: 5px;
  font-size: 9px;
  color: #8299ad;
}

.buttonRow {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 7px 10px;
  cursor: pointer;
  background: #1d75b9;
  color: white;
  font-weight: 600;
  font-size: 12px;
}

button:hover {
  background: #2e95dd;
}

.ship-icon {
  font-size: 36px;
  cursor: pointer;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.75));
}

.anchor-icon {
  font-size: 30px;
  cursor: pointer;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.75));
}

.port-label {
  background: #10283b;
  color: white;
  border: 1px solid #4f7188;
  border-radius: 5px;
  padding: 2px 6px;
}

.ais-label {
  background: #ffd54a;
  color: #111;
  border: 1px solid #8d7415;
  border-radius: 5px;
  padding: 4px 7px;
  font-weight: 800;
  white-space: nowrap;
  cursor: pointer;
}

.current-label {
  background: #ff6b35;
  color: white;
  border: 1px solid #8c2d0d;
  border-radius: 5px;
  padding: 3px 7px;
  font-weight: 800;
  white-space: nowrap;
}

.anchor-label {
  background: #2d6fa3;
  color: white;
  border: 1px solid #173c5d;
  border-radius: 5px;
  padding: 4px 8px;
  font-weight: 800;
  white-space: nowrap;
}

.ais-pulse {
  width: 20px;
  height: 20px;
  background: #ffd400;
  border: 3px solid white;
  border-radius: 50%;
  box-shadow:
    0 0 0 0 rgba(255,212,0,.75),
    0 2px 8px rgba(0,0,0,.65);
  animation: pulseAIS 1.8s infinite;
  cursor: pointer;
}

.boat-hover-photo {
  width: 250px;
}

.boat-hover-photo img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 180px;
  object-fit: cover;
  border-radius: 6px;
}

.boat-hover-name {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 800;
  text-align: center;
  color: #10283b;
}

@keyframes pulseAIS {

  0% {
    box-shadow:
      0 0 0 0 rgba(255,212,0,.75),
      0 2px 8px rgba(0,0,0,.65);
  }

  70% {
    box-shadow:
      0 0 0 16px rgba(255,212,0,0),
      0 2px 8px rgba(0,0,0,.65);
  }

  100% {
    box-shadow:
      0 0 0 0 rgba(255,212,0,0),
      0 2px 8px rgba(0,0,0,.65);
  }
}

@media (max-width: 600px) {

  .header {
    top: 5px;
    left: 5px;
    right: 5px;
    padding: 5px 7px;
  }

  .vesselHeader {
    gap: 7px;
  }

  .headerBoatImage {
    width: 60px;
    height: 42px;
  }

  .header h2 {
    font-size: 14px;
  }

  .header .sub {
    font-size: 9px;
  }

  #aisHeadline {
    top: 61px;
    left: 5px;
    right: 5px;
    padding: 6px 8px;
    font-size: 9.5px;
  }

  #dateDisplay {
    font-size: 14px;
  }

  #status {
    font-size: 9.5px;
  }

  .sliderLabels {
    font-size: 8px;
  }

  button {
    flex: 1 1 auto;
    font-size: 10px;
    padding: 6px 7px;
  }

  .ais-label {
    white-space: normal;
    max-width: 220px;
  }

  .boat-hover-photo {
    width: 190px;
  }
}

</style>
</head>

<body>

<div class="header vesselHeader">

  <img
    src="1.jpg"
    alt="MORNING CARA"
    class="headerBoatImage"
  >

  <div class="headerBoatText">

    <h2>🚢 MORNING CARA</h2>

    <div class="sub">
      IMO 9574092 · MMSI 441148000 · Tesla voyage tracker
    </div>

  </div>

</div>

<div id="aisHeadline">
  🟡 <strong>Loading latest AIS…</strong>
</div>

<div id="map"></div>

<div id="controls">

  <div id="dateDisplay"></div>
  <div id="status"></div>

  <input
    id="slider"
    type="range"
    min="0"
    value="0"
    step="1"
  >

  <div class="sliderLabels">
    <span>Last AIS</span>
    <span>Anchored</span>
    <span>Auckland</span>
  </div>

  <div class="buttonRow">
    <button id="todayButton">Today</button>
    <button id="arrivalButton">Arrival</button>
    <button id="refreshButton">↻ Refresh</button>
    <button id="playButton">▶ Play</button>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>


/* =================================================
   VESSEL
   ================================================= */

const VESSEL_NAME = "MORNING CARA";
const IMO = "9574092";
const MMSI = "441148000";

const DEFAULT_SOURCE_URL =
  "https://www.marineradar.com/vessel/mmsi-441148000/morning-cara";

let currentSourceURL =
  DEFAULT_SOURCE_URL;


const POAL_SOURCE_URL =
  "https://www.poal.co.nz/operations/schedules/arrivals";

let poalPilotBoardingETA = null;
let poalBerthETA = null;
let poalWharf = "";
let poalScheduleUpdatedAt = null;


/* =================================================
   VOYAGE
   ================================================= */

const SHANGHAI = {
  name: "Shanghai",
  lat: 31.2304,
  lng: 121.4737,
  time: new Date("2026-08-15T18:02:00Z")
};


let AUCKLAND = {
  name: "Auckland",
  lat: -36.8406,
  lng: 174.7850,

  // Fallback only. Live value is replaced from ais.json
  // using Ports of Auckland expected-arrivals data.
  time: new Date("2026-09-02T06:00:00Z")
};


/*
   Estimated time MORNING CARA leaves anchorage
   and begins final approach to Auckland.

   Tuesday 1 September 2026
   9:30 pm NZST
*/

let FINAL_APPROACH = {
  time: new Date("2026-09-01T09:30:00Z")
};


/* =================================================
   ICONS
   ================================================= */

const shipIcon =
  L.divIcon({
    html: '<div class="ship-icon">🚢</div>',
    className: "",
    iconSize: [44,44],
    iconAnchor: [22,22]
  });


const anchorIcon =
  L.divIcon({
    html: '<div class="anchor-icon">⚓</div>',
    className: "",
    iconSize: [40,40],
    iconAnchor: [20,20]
  });


const aisIcon =
  L.divIcon({
    html: '<div class="ais-pulse"></div>',
    className: "",
    iconSize: [26,26],
    iconAnchor: [13,13]
  });


/* =================================================
   FALLBACK AIS
   ================================================= */

let latestAIS = {
  lat: 24.7002,
  lng: 127.1542,
  time: new Date("2026-08-17T01:11:00Z"),
  reported: "2026-08-17T01:11:00Z",
  speed: 17.6,
  course: 142,
  heading: 144,
  waterBody: "East China Sea",
  navigationStatus: "Under way using engine",
  source: "MarineRadar terrestrial AIS",
  sourceURL: DEFAULT_SOURCE_URL,
  checkedAt: null
};


/* =================================================
   MAP
   ================================================= */

const map =
  L.map("map", {
    zoomControl: true
  });


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 18,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =================================================
   PORT MARKERS
   ================================================= */

function addPortMarker(point) {

  L.circleMarker(
    [point.lat, point.lng],
    {
      radius: 6,
      color: "#ffffff",
      weight: 2,
      fillColor: "#1a89d9",
      fillOpacity: 1
    }
  )
  .addTo(map)
  .bindTooltip(
    point.name,
    {
      permanent: true,
      direction: "top",
      className: "port-label"
    }
  );
}


addPortMarker(SHANGHAI);
addPortMarker(AUCKLAND);


/* =================================================
   AUCKLAND AIS RANGE
   ================================================= */

const NM_TO_METERS = 1852;


L.circle(
  [AUCKLAND.lat, AUCKLAND.lng],
  {
    radius: 40 * NM_TO_METERS,
    color: "#0f7a3d",
    weight: 5,
    opacity: .95,
    fillColor: "#0f7a3d",
    fillOpacity: .03
  }
)
.addTo(map)
.bindTooltip(
  "Auckland · likely terrestrial AIS range ~40 nm",
  {
    permanent: false,
    direction: "center",
    className: "port-label"
  }
);


/* =================================================
   REAL AIS MARKER
   ================================================= */

const aisMarker =
  L.marker(
    [latestAIS.lat, latestAIS.lng],
    {
      icon: aisIcon,
      zIndexOffset: 5000
    }
  )
  .addTo(map)
  .bindTooltip(
    "Last real AIS · click for source",
    {
      permanent: true,
      direction: "left",
      offset: [-12,0],
      className: "ais-label"
    }
  );


aisMarker.on(
  "click",
  () => {

    window.open(
      currentSourceURL,
      "_blank",
      "noopener"
    );

  }
);


/* =================================================
   ESTIMATED POSITION + BOAT IMAGE
   ================================================= */

const ship =
  L.marker(
    [latestAIS.lat, latestAIS.lng],
    {
      icon: shipIcon,
      zIndexOffset: 3000
    }
  )
  .addTo(map)
  .bindTooltip(
    "Estimated position",
    {
      permanent: true,
      direction: "right",
      offset: [18,0],
      className: "current-label"
    }
  )
  .bindPopup(
    `
      <div class="boat-hover-photo">

        <img
          src="1.jpg"
          alt="MORNING CARA"
        >

        <div class="boat-hover-name">
          🚢 MORNING CARA
        </div>

      </div>
    `,
    {
      maxWidth: 280,
      closeButton: false,
      autoPan: false,
      offset: [0,-15]
    }
  );


ship.on(
  "mouseover",
  function () {
    this.openPopup();
  }
);


ship.on(
  "mouseout",
  function () {
    this.closePopup();
  }
);


ship.on(
  "click",
  function () {

    if (
      this.isPopupOpen()
    ) {
      this.closePopup();
    }
    else {
      this.openPopup();
    }

  }
);


/* =================================================
   ROUTE LINES
   ================================================= */

const travelledLine =
  L.polyline(
    [],
    {
      color: "#00c2ff",
      weight: 5,
      opacity: .95
    }
  )
  .addTo(map);


const futureRoute =
  L.polyline(
    [],
    {
      color: "#469fe1",
      weight: 3,
      opacity: .55,
      dashArray: "8 8"
    }
  )
  .addTo(map);


/* =================================================
   HELPERS
   ================================================= */

function interpolate(a, b, fraction) {

  const f =
    Math.max(
      0,
      Math.min(
        1,
        fraction
      )
    );


  return {

    lat:
      a.lat +
      (b.lat - a.lat) * f,

    lng:
      a.lng +
      (b.lng - a.lng) * f

  };
}


function distanceNm(lat1, lng1, lat2, lng2) {

  const meters =
    map.distance(
      [lat1, lng1],
      [lat2, lng2]
    );


  return meters / 1852;
}


/* =================================================
   POSITION ESTIMATE

   AIS → stationary at anchor → final approach → Auckland
   ================================================= */

function getEstimatedPosition(selectedTime) {


  /*
     Before/latest AIS fix
  */

  if (
    selectedTime <= latestAIS.time
  ) {

    return {
      lat: latestAIS.lat,
      lng: latestAIS.lng,
      leg: "AIS"
    };
  }


  /*
     Ship remains stationary at the anchorage.

     This intentionally does NOT interpolate the position.
  */

  if (
    selectedTime < FINAL_APPROACH.time
  ) {

    return {
      lat: latestAIS.lat,
      lng: latestAIS.lng,
      leg: "ANCHORED"
    };
  }


  /*
     Once arrival time has been reached,
     show ship in Auckland.
  */

  if (
    selectedTime >= AUCKLAND.time
  ) {

    return {
      lat: AUCKLAND.lat,
      lng: AUCKLAND.lng,
      leg: "AUCKLAND"
    };
  }


  /*
     Final approach.

     Interpolate from the latest AIS anchorage position
     from POAL pilot boarding ETA to approximate berth ETA.
  */

  const fraction =
    (
      selectedTime -
      FINAL_APPROACH.time
    )
    /
    (
      AUCKLAND.time -
      FINAL_APPROACH.time
    );


  return {

    ...interpolate(
      latestAIS,
      AUCKLAND,
      fraction
    ),

    leg: "FINAL_APPROACH"

  };
}


/* =================================================
   SLIDER
   ================================================= */

const slider =
  document.getElementById(
    "slider"
  );


function updateSliderRange() {

  const totalHours =
    Math.max(
      1,
      Math.ceil(
        (
          AUCKLAND.time -
          latestAIS.time
        )
        /
        3600000
      )
    );


  slider.min = 0;
  slider.max = totalHours;
}


/* =================================================
   NZ TIME
   ================================================= */

const dateFormat =
  new Intl.DateTimeFormat(
    "en-NZ",
    {
      timeZone: "Pacific/Auckland",
      weekday: "short",
      day: "numeric",
      month: "short",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );


const checkedFormat =
  new Intl.DateTimeFormat(
    "en-NZ",
    {
      timeZone: "Pacific/Auckland",
      weekday: "short",
      day: "numeric",
      month: "short",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );


function getAISNZTime() {

  if (
    !latestAIS.time ||
    isNaN(
      latestAIS.time.getTime()
    )
  ) {

    return "unknown";
  }


  return dateFormat.format(
    latestAIS.time
  );
}


function getCheckedNZTime() {

  if (
    !latestAIS.checkedAt
  ) {

    return "unknown";
  }


  const checkedDate =
    new Date(
      latestAIS.checkedAt
    );


  if (
    isNaN(
      checkedDate.getTime()
    )
  ) {

    return "unknown";
  }


  return checkedFormat.format(
    checkedDate
  );
}


/* =================================================
   AIS LABEL
   ================================================= */

function updateAISLabel() {

  const aisNZTime =
    getAISNZTime();


  aisMarker.setTooltipContent(
    "AIS fix: " +
    aisNZTime
  );
}


/* =================================================
   STATUS / AIS RANGE
   ================================================= */

function getAisRangeHint(p) {

  const distance =
    distanceNm(
      p.lat,
      p.lng,
      AUCKLAND.lat,
      AUCKLAND.lng
    );


  if (
    distance <= 40
  ) {

    return (
      ` · 📡 within Auckland terrestrial AIS range ` +
      `(${distance.toFixed(0)} nm)`
    );
  }


  if (
    distance <= 80
  ) {

    return (
      ` · 📡 approaching Auckland AIS range ` +
      `(${distance.toFixed(0)} nm)`
    );
  }


  return (
    ` · Auckland ${distance.toFixed(0)} nm`
  );
}


/* =================================================
   UPDATE DISPLAY
   ================================================= */

function updateVoyage(hours) {

  const selected =
    new Date(
      latestAIS.time.getTime() +
      hours * 3600000
    );


  const p =
    getEstimatedPosition(
      selected
    );


  ship.setLatLng(
    [p.lat, p.lng]
  );


  /*
     Change the icon and tooltip to make the anchored
     state visually obvious.
  */

  if (
    p.leg === "ANCHORED"
  ) {

    ship.setIcon(
      anchorIcon
    );

    ship.setTooltipContent(
      "⚓ MORNING CARA · At anchor"
    );

  }
  else {

    ship.setIcon(
      shipIcon
    );


    if (
      p.leg === "FINAL_APPROACH"
    ) {

      ship.setTooltipContent(
        "🚢 Final approach"
      );

    }
    else if (
      p.leg === "AUCKLAND"
    ) {

      ship.setTooltipContent(
        "📍 Auckland"
      );

    }
    else {

      ship.setTooltipContent(
        "Last real AIS position"
      );

    }

  }


  document
    .getElementById(
      "dateDisplay"
    )
    .textContent =
      dateFormat.format(
        selected
      );


  let status;


  switch (p.leg) {


    case "AIS":

      status =
        "Last real AIS position";

      break;


    case "ANCHORED":

      status =
        "⚓ At anchor · stationary";

      break;


    case "FINAL_APPROACH":

      status =
        "🚢 Final approach · estimated";

      break;


    default:

      status =
        "📍 Auckland · docked";

  }


  const latitude =
    Math.abs(
      p.lat
    ).toFixed(2) +
    "°" +
    (
      p.lat < 0
        ? "S"
        : "N"
    );


  const longitude =
    Math.abs(
      p.lng
    ).toFixed(2) +
    "°" +
    (
      p.lng < 0
        ? "W"
        : "E"
    );


  document
    .getElementById(
      "status"
    )
    .textContent =
      status +
      " · " +
      latitude +
      ", " +
      longitude +
      getAisRangeHint(
        p
      );


  updateRouteLines(
    p
  );
}


/* =================================================
   ROUTE DISPLAY

   Shanghai
     ↓
   real AIS
     ↓
   stationary anchorage
     ↓
   final approach
     ↓
   Auckland
   ================================================= */

function updateRouteLines(p) {


  /*
     At the AIS position or anchored.

     Travelled line ends at the real position.
     Dashed line shows the future route to Auckland.
  */

  if (
    p.leg === "AIS" ||
    p.leg === "ANCHORED"
  ) {

    travelledLine.setLatLngs([
      [SHANGHAI.lat, SHANGHAI.lng],
      [latestAIS.lat, latestAIS.lng]
    ]);


    futureRoute.setLatLngs([
      [latestAIS.lat, latestAIS.lng],
      [AUCKLAND.lat, AUCKLAND.lng]
    ]);


    return;
  }


  /*
     Ship has started final approach.
  */

  if (
    p.leg === "FINAL_APPROACH"
  ) {

    travelledLine.setLatLngs([
      [SHANGHAI.lat, SHANGHAI.lng],
      [latestAIS.lat, latestAIS.lng],
      [p.lat, p.lng]
    ]);


    futureRoute.setLatLngs([
      [p.lat, p.lng],
      [AUCKLAND.lat, AUCKLAND.lng]
    ]);


    return;
  }


  /*
     Vessel has arrived.
  */

  if (
    p.leg === "AUCKLAND"
  ) {

    travelledLine.setLatLngs([
      [SHANGHAI.lat, SHANGHAI.lng],
      [latestAIS.lat, latestAIS.lng],
      [AUCKLAND.lat, AUCKLAND.lng]
    ]);


    futureRoute.setLatLngs([]);


    return;
  }

}


/* =================================================
   TODAY
   ================================================= */

function goToday() {

  let hours =
    Math.round(
      (
        Date.now() -
        latestAIS.time.getTime()
      )
      /
      3600000
    );


  hours =
    Math.max(
      0,
      Math.min(
        Number(
          slider.max
        ),
        hours
      )
    );


  slider.value =
    hours;


  updateVoyage(
    hours
  );
}


/* =================================================
   ARRIVAL
   ================================================= */

function goArrival() {

  slider.value =
    slider.max;


  updateVoyage(
    Number(
      slider.max
    )
  );
}


/* =================================================
   LOAD ais.json
   ================================================= */

async function refreshAIS() {

  const headline =
    document.getElementById(
      "aisHeadline"
    );


  headline.innerHTML =
    "🟡 <strong>Checking latest saved MORNING CARA AIS…</strong>";


  try {

    const response =
      await fetch(
        "ais.json?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "ais.json HTTP " +
        response.status
      );
    }


    const ais =
      await response.json();


    if (
      ais.imo &&
      String(
        ais.imo
      ) !== IMO
    ) {

      throw new Error(
        "ais.json contains wrong vessel IMO " +
        ais.imo
      );
    }


    if (
      ais.mmsi &&
      String(
        ais.mmsi
      ) !== MMSI
    ) {

      throw new Error(
        "ais.json contains wrong MMSI " +
        ais.mmsi
      );
    }


    if (
      !Number.isFinite(
        Number(
          ais.lat
        )
      ) ||
      !Number.isFinite(
        Number(
          ais.lng
        )
      ) ||
      !ais.time
    ) {

      throw new Error(
        "Invalid ais.json"
      );
    }


    const parsedAISTime =
      new Date(
        ais.time
      );


    if (
      isNaN(
        parsedAISTime.getTime()
      )
    ) {

      throw new Error(
        "Invalid AIS time"
      );
    }


    /*
       Ports of Auckland live ETA.
       POAL's "Arrival" is pilot boarding time; POAL says berth
       is approximately 1.5 hours later.
    */

    const parsedPoalPilot =
      ais.poal_pilot_boarding_eta
        ? new Date(ais.poal_pilot_boarding_eta)
        : (
            ais.poal_eta
              ? new Date(ais.poal_eta)
              : null
          );

    const parsedPoalBerth =
      ais.poal_berth_eta
        ? new Date(ais.poal_berth_eta)
        : null;

    if (
      parsedPoalPilot &&
      !isNaN(parsedPoalPilot.getTime())
    ) {
      poalPilotBoardingETA =
        parsedPoalPilot;

      FINAL_APPROACH.time =
        parsedPoalPilot;
    }

    if (
      parsedPoalBerth &&
      !isNaN(parsedPoalBerth.getTime())
    ) {
      poalBerthETA =
        parsedPoalBerth;

      AUCKLAND.time =
        parsedPoalBerth;
    }
    else if (
      poalPilotBoardingETA
    ) {
      poalBerthETA =
        new Date(
          poalPilotBoardingETA.getTime() +
          90 * 60 * 1000
        );

      AUCKLAND.time =
        poalBerthETA;
    }

    poalWharf =
      ais.poal_wharf ||
      "";

    poalScheduleUpdatedAt =
      ais.poal_schedule_updated_at
        ? new Date(
            ais.poal_schedule_updated_at
          )
        : null;


    latestAIS = {

      lat:
        Number(
          ais.lat
        ),

      lng:
        Number(
          ais.lng
        ),

      time:
        parsedAISTime,

      reported:
        ais.reported ||
        ais.time,

      speed:
        ais.speed === null ||
        ais.speed === undefined
          ? null
          : Number(
              ais.speed
            ),

      course:
        ais.course === null ||
        ais.course === undefined
          ? null
          : Number(
              ais.course
            ),

      heading:
        ais.heading === null ||
        ais.heading === undefined
          ? null
          : Number(
              ais.heading
            ),

      waterBody:
        ais.waterBody ||
        ais.port ||
        "",

      navigationStatus:
        ais.navigation_status ||
        "",

      source:
        ais.source ||
        "AIS",

      sourceURL:
        ais.source_url ||
        DEFAULT_SOURCE_URL,

      checkedAt:
        ais.checked_at ||
        null

    };


    currentSourceURL =
      latestAIS.sourceURL;


    aisMarker.setLatLng([
      latestAIS.lat,
      latestAIS.lng
    ]);


    updateAISLabel();


    const aisNZTime =
      getAISNZTime();


    const checkedNZTime =
      getCheckedNZTime();


    let text =
      `🟡 <strong>AIS fix:</strong>
       ${aisNZTime}
       · ${latestAIS.lat.toFixed(5)}°,
       ${latestAIS.lng.toFixed(5)}°`;


    if (
      Number.isFinite(
        latestAIS.speed
      )
    ) {

      text +=
        ` · ${latestAIS.speed} kn`;
    }


    if (
      Number.isFinite(
        latestAIS.course
      )
    ) {

      text +=
        ` · COG ${latestAIS.course}°`;
    }


    if (
      latestAIS.navigationStatus
    ) {

      text +=
        ` · ${latestAIS.navigationStatus}`;
    }


    if (
      latestAIS.waterBody
    ) {

      text +=
        ` · ${latestAIS.waterBody}`;
    }


    if (
      poalPilotBoardingETA
    ) {

      text +=
        `<br>
         ⚓ <strong>POAL pilot boarding ETA:</strong>
         ${dateFormat.format(poalPilotBoardingETA)}`;

      if (
        poalBerthETA
      ) {

        text +=
          ` · <strong>approx. berth:</strong>
           ${dateFormat.format(poalBerthETA)}`;
      }

      if (
        poalWharf
      ) {

        text +=
          ` · ${poalWharf}`;
      }

      text +=
        ` · <a
         href="${POAL_SOURCE_URL}"
         target="_blank"
         rel="noopener">
         POAL
         </a>`;
    }


    /*
       Add a clear anchored indicator.

       We show it when:
       - AIS says at anchor, OR
       - speed is very low
       - and current time is before final approach.
    */

    const appearsAnchored =
      (
        latestAIS.navigationStatus
          .toLowerCase()
          .includes("anchor")
      )
      ||
      (
        Number.isFinite(
          latestAIS.speed
        ) &&
        latestAIS.speed < 1
      );


    if (
      appearsAnchored &&
      Date.now() < FINAL_APPROACH.time.getTime()
    ) {

      text +=
        `<br>
         ⚓ <strong>Current status:</strong>
         At anchor · stationary until final approach`;

    }


    text +=
      `<br>
       🔎 <strong>Last checked:</strong>
       ${checkedNZTime}`;


    text +=
      ` · <a
       href="${currentSourceURL}"
       target="_blank"
       rel="noopener">
       source
       </a>`;


    headline.innerHTML =
      text;


    updateSliderRange();

    goToday();

    fitMap();

  }

  catch (error) {

    console.warn(
      "Could not load MORNING CARA ais.json:",
      error
    );


    currentSourceURL =
      latestAIS.sourceURL ||
      DEFAULT_SOURCE_URL;


    updateAISLabel();


    const fallbackNZTime =
      getAISNZTime();


    const checkedNZTime =
      getCheckedNZTime();


    let fallbackText =
      `🟡 <strong>Using built-in last known AIS:</strong>
       ${fallbackNZTime}
       · ${latestAIS.lat.toFixed(5)}°,
       ${latestAIS.lng.toFixed(5)}°`;


    if (
      Number.isFinite(
        latestAIS.speed
      )
    ) {

      fallbackText +=
        ` · ${latestAIS.speed} kn`;
    }


    fallbackText +=
      `<br>
       🔎 <strong>Last checked:</strong>
       ${checkedNZTime}`;


    fallbackText +=
      ` · <a
       href="${currentSourceURL}"
       target="_blank"
       rel="noopener">
       source
       </a>`;


    headline.innerHTML =
      fallbackText;


    updateSliderRange();

    goToday();

    fitMap();

  }
}


/* =================================================
   FIT MAP
   ================================================= */

function fitMap() {

  const points = [
    [SHANGHAI.lat, SHANGHAI.lng],
    [latestAIS.lat, latestAIS.lng],
    [AUCKLAND.lat, AUCKLAND.lng]
  ];


  map.fitBounds(
    L.latLngBounds(
      points
    ),
    {
      padding: [45,45]
    }
  );
}


/* =================================================
   PLAY
   ================================================= */

let timer =
  null;


function playVoyage() {

  const button =
    document.getElementById(
      "playButton"
    );


  if (
    timer
  ) {

    clearInterval(
      timer
    );


    timer =
      null;


    button.textContent =
      "▶ Play";


    return;
  }


  slider.value =
    0;


  updateVoyage(
    0
  );


  button.textContent =
    "⏸ Pause";


  timer =
    setInterval(
      () => {

        let hours =
          Number(
            slider.value
          ) +
          3;


        if (
          hours >
          Number(
            slider.max
          )
        ) {

          clearInterval(
            timer
          );


          timer =
            null;


          button.textContent =
            "▶ Play";


          return;
        }


        slider.value =
          hours;


        updateVoyage(
          hours
        );

      },
      40
    );
}


/* =================================================
   EVENTS
   ================================================= */

document
  .getElementById(
    "todayButton"
  )
  .addEventListener(
    "click",
    goToday
  );


document
  .getElementById(
    "arrivalButton"
  )
  .addEventListener(
    "click",
    goArrival
  );


document
  .getElementById(
    "refreshButton"
  )
  .addEventListener(
    "click",
    refreshAIS
  );


document
  .getElementById(
    "playButton"
  )
  .addEventListener(
    "click",
    playVoyage
  );


slider.addEventListener(
  "input",
  () => {

    updateVoyage(
      Number(
        slider.value
      )
    );

  }
);


/* =================================================
   MOBILE RESIZE
   ================================================= */

function resizeMap() {

  setTimeout(
    () => {
      map.invalidateSize();
    },
    100
  );
}


window.addEventListener(
  "resize",
  resizeMap
);


window.addEventListener(
  "orientationchange",
  resizeMap
);


/* =================================================
   START
   ================================================= */

updateSliderRange();

goToday();

fitMap();

updateAISLabel();

refreshAIS();


setInterval(
  refreshAIS,
  5 * 60 * 1000
);

</script>
